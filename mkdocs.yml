# Documentation site for Rediska, built with MkDocs + Material for MkDocs.
#   Preview locally:  pip install -r docs/requirements.txt && mkdocs serve
#   API pages:        generated into docs/api/ by gomarkdoc (see docs.yml)
site_name: Rediska
site_description: A Redis-compatible in-memory key-value server written in Go
site_url: https://vinayhpandya.github.io/rediska/
repo_url: https://github.com/vinayhpandya/rediska
repo_name: vinayhpandya/rediska
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Follow the reader's system setting, with a toggle in the header.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections   # sidebar groups (Guides, API reference)
    - navigation.top        # "back to top" button
    - navigation.footer     # previous / next page links
    - search.suggest
    - search.highlight
    - content.code.copy     # copy button on code blocks

markdown_extensions:
  - admonition              # !!! note boxes
  - attr_list
  - md_in_html              # Markdown inside the HTML gomarkdoc emits
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys           # ++ctrl+c++
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid     # ```mermaid blocks become diagrams
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Fail the build (with --strict) on broken links between pages.
validation:
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Guides:
      - Getting started: getting-started.md
      - Cluster mode: cluster.md
      - Design decisions: design-decisions.md
      - Testing: testing.md
      - Releasing: releasing.md
      - Performance: performance.md
  - API reference:
      - cluster: api/cluster.md
      - commands: api/commands.md
      - config: api/config.md
      - core: api/core.md
      - core/sds: api/core/sds.md
      - server: api/server.md
      - store: api/store.md
      - store/hll: api/store/hll.md
  - Changelog: changelog.md
